# Tmux Configuration

# -- Basic Settings ------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"

# Panes start nu via the interactive-shell launcher (zsh login env, zsh
# fallback). Before Ansible has installed it, fall back to the login shell.
set -g default-command "[ -x ~/.local/bin/interactive-shell ] && exec ~/.local/bin/interactive-shell || exec $SHELL -l"
# True colour: terminal-features is the modern replacement for terminal-overrides.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs      # EDITOR=nvim would otherwise switch this to vi
setw -g mode-keys vi          # Explicit vi copy-mode for copy-mode-vi bindings & tmux-yank
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off  # Switch to another session instead of detaching (sesh-friendly)

set -g mouse on
set -g allow-passthrough on
set -g focus-events on
set -s set-clipboard on       # Sync copy-mode to host clipboard via OSC 52 (works over SSH/Mosh)

unbind -T root MouseDrag1Border
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi [ send -X previous-prompt
bind -T copy-mode-vi ] send -X next-prompt

# -- Vim-style pane navigation --------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Alt+arrow (no prefix needed)
bind -n M-Left  resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

# Split panes with intuitive keys (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Window navigation (formerly provided by tmux-sensible)
bind a last-window
bind C-p previous-window
bind C-n next-window

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Sesh session picker (prefix + T)
bind-key T run-shell "sesh connect \"\$(sesh list --icons | fzf-tmux -p 80%,70% --reverse --border --prompt 'sesh > ')\""

# -- Catppuccin theme config (before loading) ------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_host_text " #h"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M"
set -g @catppuccin_battery_text " #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"
set -g @catppuccin_battery_icon "#(~/.tmux/plugins/tmux-battery/scripts/battery_icon_charge.sh) "

# Load Catppuccin before defining status-left/status-right so TPM (loaded last)
# can append tmux-continuum's auto-save hook to status-right without it being
# overwritten.
if-shell '[ -x ~/.tmux/plugins/tmux/catppuccin.tmux ]' \
  'run ~/.tmux/plugins/tmux/catppuccin.tmux'

# -- Status line (must be AFTER catppuccin loads, BEFORE TPM) --
set -g status-position bottom
set -g status-interval 30
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# Only show battery on machines with an internal battery (laptops)
if-shell 'pmset -g batt | grep -q InternalBattery' \
  'set -ag status-right "#{E:@catppuccin_status_battery}"'

# -- Plugins (TPM must stay at the very bottom) ----------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Continuum: auto-save every 15 mins, auto-restore on start
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Must stay AFTER TPM so it overrides tmux-yank's prefix+y (copy_line.sh).
# Captures the active pane's scrollback with wrapped lines joined and copies
# the last command's output (matching oh-my-posh's U+F105 closer or plain prompt).
bind y run-shell "python3 -c 'import re, subprocess, sys; p = sys.argv[1]; lines = subprocess.check_output([\"tmux\", \"capture-pane\", \"-t\", p, \"-p\", \"-J\", \"-S\", \"-\"], text=True).splitlines(); rx = re.compile(chr(0xf105) + r\"([ \t]|$)|^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+:.*[%#$]([ \t]|$)\"); idxs = [i for i, l in enumerate(lines) if rx.search(l)]; out = chr(10).join(lines[idxs[-2]+1:idxs[-1]]).rstrip() if len(idxs) >= 2 else \"\"; subprocess.run([\"pbcopy\"], input=out, text=True, check=True); n = len(out.splitlines()) if out else 0; subprocess.run([\"tmux\", \"display-message\", f\"Copied {n} line(s) from last command\"])' #{pane_id}"

# Stripped-down tmux config for iPad/iPhone (Prompt 3 over mosh).
# Activated by: tmux -f ~/.tmux.mobile.conf
# Inherits keybindings/options from main config, then overrides the
# Catppuccin status line so no Nerd Font glyphs are required.

source-file ~/.tmux.conf

# Plain ASCII status — overrides catppuccin status segments set above.
set -g status-style              'fg=white,bg=default'
set -g status-left-length        30
set -g status-right-length       40
set -g status-interval           30
set -g status-left               '[#S] '
set -g status-right              '#h %H:%M %d-%b'
set -g window-status-current-format '#[fg=cyan,bold] #I:#W '
set -g window-status-format         ' #I:#W '
set -g pane-border-style            'fg=brightblack'
set -g pane-active-border-style     'fg=cyan'

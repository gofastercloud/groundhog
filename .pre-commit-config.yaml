repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
      # Shell .j2 templates (dev_tools/templates/*.j2) are deliberately excluded:
      # they are zsh scripts with Jinja markup, which ShellCheck cannot parse.
      # tests/test_setup.sh checks them with `zsh -n` instead.
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck --severity=warning
        language: system
        files: '^(dotfiles\.sh|scripts/.*\.sh|tests/.*\.sh|ansible/bootstrap\.sh|ansible/roles/.*/files/.*\.sh)$'
      - id: ansible-lint
        name: Ansible Lint
        entry: env ANSIBLE_DEPRECATION_WARNINGS=0 ansible-lint
        language: system
        files: '^(ansible/.*\.yml|ansible/.*\.yaml)$'
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        files: '^(\.pre-commit-config\.yaml|ansible/.*\.ya?ml|gh/.*\.ya?ml|lazygit/.*\.ya?ml)$'

# Custom symlinks processed automatically by ./dotfiles.sh link.
# Format: <path-relative-to-custom>:<target-path>
#
# Examples:
# gitconfig:$HOME/.gitconfig.custom
# ssh/.ssh/config.d:$HOME/.ssh/config.d
# ssh/.ssh/authorized_keys:$HOME/.ssh/authorized_keys
# ssh/.ssh/allowed_signers:$HOME/.ssh/allowed_signers
# aws/.aws/config:$HOME/.aws/config

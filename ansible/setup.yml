---
# setup.yml — Main playbook. Run via bootstrap.sh or:
#   ansible-playbook ansible/setup.yml --ask-become-pass   # or -K
#
# Selective runs with tags:
#   ansible-playbook ansible/setup.yml --ask-become-pass --tags "homebrew,defaults,dotfiles"
#
# Available tags: sudo, homebrew, defaults, dock, dev-tools, agents, claude,
#                 antigravity, codex, agent-git, yubikey, immurok, dotfiles, custom
#
# Variable precedence (lowest -> highest):
#   1. ansible/vars/default.config.yml  (public defaults)
#   2. custom/config.yml                (optional private overlay repo)
#   3. ansible/vars/config.yml          (optional per-machine overrides, git-ignored)

- name: Configure macOS workstation
  hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars_files:
    - vars/default.config.yml

  pre_tasks:
    - name: Ensure we're on macOS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == "Darwin"
        fail_msg: "This playbook is macOS-only."
      tags: ['always']

    - name: Set dotfiles_dir
      ansible.builtin.set_fact:
        dotfiles_dir: "{{ playbook_dir | dirname }}"
      tags: ['always']

    - name: Check for private overlay config (custom/config.yml)
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/custom/config.yml"
      register: setup_custom_config
      tags: ['always']

    - name: Load private overlay config (custom/config.yml)
      ansible.builtin.include_vars:
        file: "{{ dotfiles_dir }}/custom/config.yml"
      when: setup_custom_config.stat.exists
      tags: ['always']

    - name: Create per-machine config.yml if missing (fresh clone)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/vars/config.yml"
        mode: "0600"
        content: |
          ---
          # config.yml — Per-machine overrides (git-ignored).
          # See vars/default.config.yml for available options.
        force: false
      tags: ['always']

    - name: Check for local variable overrides
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/config.yml"
      register: local_config
      tags: ['always']

    - name: Load local variable overrides
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/config.yml"
      when: local_config.stat.exists
      tags: ['always']

    # Lightweight form-factor detection for power.yml and Touch ID (pam_tid).
    - name: Check for an internal battery
      ansible.builtin.command:
        cmd: pmset -g batt
      register: setup_batt
      changed_when: false
      failed_when: false
      check_mode: false
      when: machine_profile is not defined
      tags: ['always']

    - name: Auto-detect laptop vs desktop from battery presence
      ansible.builtin.set_fact:
        machine_profile: "{{ 'laptop' if 'InternalBattery' in (setup_batt.stdout | default('')) else 'desktop' }}"
      when: machine_profile is not defined
      tags: ['always']

    - name: Show detected machine profile
      ansible.builtin.debug:
        msg: "Machine profile: {{ machine_profile }} (hostname: {{ ansible_facts['hostname'] }})"
      tags: ['always']

  roles:
    - {role: sudo, tags: ['sudo']}
    - {role: homebrew, tags: ['homebrew']}
    - {role: macos_defaults, tags: ['defaults']}
    - {role: dock, tags: ['dock']}
    - {role: dev_tools, tags: ['dev-tools']}
    - {role: claude_code, tags: ['claude', 'agents'], when: claude_code_enabled | bool}
    - {role: antigravity, tags: ['antigravity', 'agents'], when: antigravity_enabled | bool}
    - {role: codex, tags: ['codex', 'agents'], when: codex_enabled | bool}
    - {role: agent_git, tags: ['agent-git', 'agents'], when: agent_git_enabled | bool}
    - {role: agency, tags: ['agency', 'agents'], when: agency_enabled | bool}
    - {role: yubikey, tags: ['yubikey'], when: yubikey_enabled | bool}
    - {role: immurok, tags: ['immurok'], when: immurok_enabled | bool}

  tasks:
    - name: Check for custom overlay tasks (custom/tasks.yml)
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/custom/tasks.yml"
      register: setup_custom_tasks
      tags: ['custom', 'dev-tools', 'groundhog-dev']

    - name: Run custom overlay tasks (custom/tasks.yml)
      ansible.builtin.include_tasks:
        file: "{{ dotfiles_dir }}/custom/tasks.yml"
      when: setup_custom_tasks.stat.exists
      tags: ['custom', 'dev-tools', 'groundhog-dev']

    # Run groundhog link to stow configs, manual symlinks, and custom overlay links
    - name: Stow dotfiles and create manual symlinks
      ansible.builtin.command:
        cmd: "{{ dotfiles_dir }}/groundhog link"
      register: stow_result
      changed_when: "'Stowing' in stow_result.stdout or '→' in stow_result.stdout"
      tags: ['dotfiles']

  post_tasks:
    - name: Generate finalise script
      ansible.builtin.copy:
        dest: /tmp/finalise.sh
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # finalise.sh — Post-playbook steps that need manual interaction.
          # Generated by ansible. Run: bash /tmp/finalise.sh
          set -euo pipefail

          if command -v brew >/dev/null 2>&1; then
            eval "$(brew shellenv)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [[ -x /usr/local/bin/brew ]]; then
            eval "$(/usr/local/bin/brew shellenv)"
          else
            echo "Homebrew is not available." >&2
            exit 1
          fi

          echo "=== Step 1: Launch OrbStack and apply hardened defaults ==="
          if ! command -v orb &>/dev/null; then
            echo "Opening OrbStack for first-time setup..."
            open -a OrbStack
            echo "Wait for OrbStack to finish setup, then re-run:"
            echo "  {{ dotfiles_dir }}/groundhog ansible --tags defaults"
          else
            echo "OrbStack CLI available. Applying OrbStack defaults..."
            "{{ dotfiles_dir }}/groundhog" ansible --tags defaults
          fi
          echo

          echo "=== Step 2: Secretive (Secure Enclave SSH & git signing) ==="
          if [[ ! -f ~/.ssh/id_secretive.pub ]]; then
            echo "Open Secretive, enable SecretAgent, create auth + signing keys, then link them:"
            echo "  open -a Secretive"
            echo "  PUB=~/Library/Containers/com.maxgoedjen.Secretive.SecretAgent/Data/PublicKeys"
            echo "  ln -sf \"\$PUB/<auth>.pub\" ~/.ssh/id_secretive.pub"
            echo "  ln -sf \"\$PUB/<sign>.pub\" ~/.ssh/id_secretive_sign.pub"
            echo "  git config --file ~/.gitconfig.local user.signingkey ~/.ssh/id_secretive_sign.pub"
            echo
          fi

          if [[ "{{ yubikey_enabled | bool | lower }}" == "true" ]]; then
            echo "=== Step 3: YubiKey break-glass setup ==="
            if [[ ! -f ~/.config/Yubico/u2f_keys ]]; then
              echo "Register your YubiKey for sudo:"
              echo "  mkdir -p ~/.config/Yubico"
              echo "  pamu2fcfg > ~/.config/Yubico/u2f_keys"
              echo
            fi
            if [[ ! -f ~/.ssh/id_ed25519_sk ]]; then
              echo "Load or create a FIDO2 SSH key on your YubiKey:"
              echo "  ssh-keygen -K   # load existing resident key, or:"
              echo "  ssh-keygen -t ed25519-sk -O resident -w internal -C \"$(hostname -s)@yubikey\""
              echo
            fi
            echo "After YubiKey registration, activate sudo via YubiKey:"
            echo "  {{ dotfiles_dir }}/groundhog ansible --tags yubikey"
            echo
          fi

          echo "=== Final steps ==="
          echo "Reload your shell:  open a new Ghostty window (or run: exec nu)"
          echo "Then log out and back in for macOS defaults to take full effect."

    - name: Post-run instructions
      ansible.builtin.debug:
        msg: >
          All done. Run 'bash /tmp/finalise.sh' for remaining manual steps.
          Then log out and back in for macOS defaults to take full effect.

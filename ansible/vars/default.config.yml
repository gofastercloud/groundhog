---
# ============================================================
# default.config.yml — Central defaults. DO NOT edit this file.
# Override values in custom/config.yml (private overlay) or
# ansible/vars/config.yml (per-machine, git-ignored).
# ============================================================

# --- User ---
user_name: "{{ ansible_facts['user_id'] }}"
home_dir: "{{ ansible_facts['env']['HOME'] }}"

# --- Optional feature flags (off by default for public users) ---
# Enable in custom/config.yml or ansible/vars/config.yml when needed.
remote_login_enabled: false
mosh_enabled: true
yubikey_enabled: false
immurok_enabled: false
claude_code_enabled: false
antigravity_enabled: false
codex_enabled: false
agent_git_enabled: false
agency_enabled: false

# Extra Claude Code deny patterns merged alongside the hardened public defaults.
claude_code_extra_deny: []

# Directories trusted by Antigravity CLI when antigravity_enabled is true.
antigravity_trusted_workspaces:
  - "{{ home_dir }}/Code"

# Optional project directories pre-trusted in ~/.codex/config.toml when codex_enabled is true.
codex_trusted_projects: []

# Repo-scoped GitHub App broker & signing config when agent_git_enabled is true.
# Override IDs, bot identity, and per-repo policies in custom/config.yml.
agent_git_app_id: ""
agent_git_installation_id: ""
agent_git_bot_name: ""
agent_git_bot_email: ""
agent_git_signing_key: "~/.config/groundhog/agent_sign_ed25519.pub"
agent_git_default_agent_name: "Groundhog Agent"
agent_git_keychain_service: "groundhog-agent-git-app-key"
agent_git_allowed_branch_prefix: "agent/"
agent_git_repo_policies: {}

# Local checkout path of groundhog-agency when agency_enabled is true.
agency_repo_dir: ""

# Minutes sudo caches credentials per TTY (macOS default 5). 1 = 60 seconds,
# keeping rapid follow-up sudo commands smooth without long-lived elevation.
sudo_timestamp_timeout: 1

# --- Spotlight exclusions ---
# Directories to exclude from Spotlight indexing (performance)
spotlight_exclusions:
  - "{{ home_dir }}/Code"
  - "{{ home_dir }}/.orbstack"
  - "{{ home_dir }}/.cache"

# --- Packages & runtimes ---
# Core packages live in homebrew/.Brewfile.
# Private overlay packages live in custom/Brewfile.
# Machine-specific packages live in homebrew/.Brewfile.local (git-ignored).
homebrew_update: false
homebrew_cleanup: false
mise_update_tools: false
node_version: "24"

# --- OrbStack defaults (portable; CPU/RAM auto-sized per host unless overridden) ---
orbstack_config:
  app.start_at_login: "false"
  data_allow_backup: "false"
  docker.expose_ports_to_lan: "false"
  machines.expose_ports_to_lan: "false"
  k8s.enable: "false"
  power.pause_in_sleep: "true"
  rosetta: "true"
  ssh.expose_port: "false"

# --- BetterDisplay portable shortcuts (override to [] in config.yml to skip) ---
betterdisplay_shortcuts:
  - key: KeyboardShortcuts_ddcInput1
    value: '{"carbonKeyCode":6,"carbonModifiers":6912}'

# --- Dock ---
# Generic starter Dock; override in custom/config.yml with your own layout.
dock_apps:
  - /System/Applications/Mail.app
  - /Applications/Google Chrome.app
  - /Applications/Visual Studio Code.app
  - /Applications/Ghostty.app
  - /System/Applications/System Settings.app

# --- Apple cruft apps to remove ---
apple_apps_to_remove:
  - GarageBand.app
  - iMovie.app
  - Keynote.app
  - Numbers.app
  - Pages.app

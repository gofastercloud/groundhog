---
# antigravity — Hardened workspace trust baseline for Antigravity CLI (opt-in).

- name: Ensure Antigravity CLI config directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.gemini/antigravity-cli"
    state: directory
    mode: "0755"

- name: Write Antigravity CLI settings with templated trusted workspaces
  ansible.builtin.template:
    src: agy-settings.json.j2
    dest: "{{ home_dir }}/.gemini/antigravity-cli/settings.json"
    mode: "0644"
    follow: false

- name: Ensure Antigravity user skills directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home_dir }}/.gemini/antigravity/skills"
    - "{{ home_dir }}/.gemini/config/skills"

- name: Link Groundhog agent skill into Antigravity
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/skills/groundhog"
    dest: "{{ item }}/groundhog"
    state: link
    force: true
  loop:
    - "{{ home_dir }}/.gemini/antigravity/skills"
    - "{{ home_dir }}/.gemini/config/skills"

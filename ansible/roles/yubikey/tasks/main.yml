---
# yubikey — Configure Yubikey for sudo, SSH, and GPG.
#
# PREREQUISITES (manual, one-time):
#   1. Install Yubico Authenticator: brew install --cask yubico-authenticator
#   2. Register your Yubikey for FIDO2:
#        mkdir -p ~/.config/Yubico
#        pamu2fcfg > ~/.config/Yubico/u2f_keys
#      Touch the key when it blinks. For a backup key:
#        pamu2fcfg -n >> ~/.config/Yubico/u2f_keys
#   3. For SSH keys on the Yubikey:
#        ssh-keygen -t ed25519-sk -C "{{ ansible_facts['hostname'] }}@yubikey"
#      This creates a hardware-bound SSH key.

# ============================================================
# Yubikey packages are in homebrew/.Brewfile (single source of truth):
#   gnupg, openssh, pam-u2f, pinentry-mac, ykman, yubico-authenticator
# ============================================================

# ============================================================
# sudo via Yubikey (pam_u2f)
# ============================================================
- name: Check if u2f_keys exists
  ansible.builtin.stat:
    path: "{{ home_dir }}/.config/Yubico/u2f_keys"
  register: yubikey_u2f_keys

- name: Warn if u2f_keys not registered
  ansible.builtin.debug:
    msg: >
      No Yubikey registered for PAM. Run:
        mkdir -p ~/.config/Yubico
        pamu2fcfg > ~/.config/Yubico/u2f_keys
      Then re-run this playbook.
  when: not yubikey_u2f_keys.stat.exists

# The PAM stack (pam_reattach, pam_immurok, pam_u2f, pam_tid) is rendered as a
# single file by the sudo role (roles/sudo/templates/sudo_local.j2). Re-run it
# here so that registering a key and running `--tags yubikey` activates sudo
# via Yubikey. pam_u2f uses 'cue' for interactive prompts; bootstrap.sh reminds
# you to unplug the Yubikey so Ansible become is not blocked.
- name: Refresh sudo PAM configuration (activates pam_u2f once a key is registered)
  ansible.builtin.include_role:
    name: sudo
    apply:
      tags: ['yubikey']
  when: yubikey_enabled | default(false) | bool

# ============================================================
# SSH via Yubikey (FIDO2 resident keys)
# Key config is managed in ssh/.ssh/config (stow package).
# ============================================================
- name: Ensure .ssh directory
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"

# Homebrew's openssh bottle includes FIDO2 support (ssh-sk-helper links libfido2).
# Use -w internal flag with ssh-keygen, and ensure the Homebrew bin directory is
# in PATH (brew shellenv) so the Homebrew ssh-keygen is used instead of Apple's
# /usr/bin one.
- name: Note about SSH Yubikey setup
  ansible.builtin.debug:
    msg: >
      To create a FIDO2 SSH key on your Yubikey:
        ssh-keygen -t ed25519-sk -O resident -w internal -C "{{ ansible_facts['hostname'] }}@yubikey"
      To load resident keys from the Yubikey on a new machine:
        ssh-keygen -K
      SSH config (identity order, keychain) is managed by stow: ssh/.ssh/config

# ============================================================
# GPG via Yubikey
# ============================================================
- name: Ensure gnupg directory
  ansible.builtin.file:
    path: "{{ home_dir }}/.gnupg"
    state: directory
    mode: "0700"

- name: Resolve Homebrew prefix
  ansible.builtin.command:
    cmd: brew --prefix
  register: yubikey_brew_prefix
  changed_when: false
  check_mode: false

- name: Configure GPG agent for Yubikey
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.gnupg/gpg-agent.conf"
    mode: "0600"
    content: |
      # GPG Agent config — managed by Ansible
      # Use pinentry-mac for GUI pin entry
      pinentry-program {{ yubikey_brew_prefix.stdout }}/bin/pinentry-mac
      # Cache for 8 hours
      default-cache-ttl 28800
      max-cache-ttl 28800
      # Enable SSH support via GPG (if using GPG keys for SSH)
      # Uncomment if your Yubikey has GPG keys loaded:
      # enable-ssh-support
    force: false

- name: Configure GPG for smart card
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.gnupg/gpg.conf"
    mode: "0600"
    content: |
      # GPG config — managed by Ansible
      use-agent
      # Prefer strong algorithms
      personal-cipher-preferences AES256 AES192 AES
      personal-digest-preferences SHA512 SHA384 SHA256
      personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
      default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
      cert-digest-algo SHA512
      s2k-digest-algo SHA512
      s2k-cipher-algo AES256
      charset utf-8
      no-comments
      no-emit-version
      no-greeting
      keyid-format 0xlong
      list-options show-uid-validity
      verify-options show-uid-validity
      with-fingerprint
      require-cross-certification
    force: false

# ============================================================
# Git commit signing with Yubikey
# ============================================================
- name: Check for existing GPG key
  ansible.builtin.command:
    cmd: gpg --card-status
  register: yubikey_gpg_card
  changed_when: false
  failed_when: yubikey_gpg_card.rc not in [0, 1, 2]

- name: Note about git signing
  ansible.builtin.debug:
    msg: >
      To enable git commit signing with your Yubikey GPG key:
        gpg --card-edit  # then 'fetch' to get your public key
        KEY_ID=$(gpg --card-status | grep 'Signature key' | awk '{print $NF}')
        git config --global user.signingkey $KEY_ID
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true

# ============================================================
# Remove legacy yubikey-lock LaunchAgent (if previously installed)
# ============================================================
- name: Check if legacy yubikey-lock LaunchAgent is loaded
  ansible.builtin.command:
    cmd: launchctl print gui/{{ ansible_facts['user_uid'] }}/com.dotfiles.yubikey-lock
  register: yubikey_lock_state
  changed_when: false
  check_mode: false
  failed_when: yubikey_lock_state.rc not in [0, 113]

- name: Unload legacy yubikey-lock LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ ansible_facts['user_uid'] }}/com.dotfiles.yubikey-lock
  when: yubikey_lock_state.rc == 0
  changed_when: true

- name: Remove legacy yubikey-lock files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ home_dir }}/Library/LaunchAgents/com.dotfiles.yubikey-lock.plist"
    - "{{ home_dir }}/.local/bin/yubikey-lock.sh"
    - "{{ home_dir }}/Library/Logs/yubikey-lock.log"

- name: Remove legacy /usr/local/bin/yubikey-lock.sh
  ansible.builtin.file:
    path: /usr/local/bin/yubikey-lock.sh
    state: absent
  become: true

# ============================================================
# Chrome / Web Auth (passkeys)
# ============================================================
- name: Note about passkeys
  ansible.builtin.debug:
    msg: >
      Your Yubikey works as a FIDO2/WebAuthn authenticator in browsers
      out of the box. Use it for passkeys on GitHub, Google, AWS, etc.
      No additional config needed — just register it in each service's
      security settings.

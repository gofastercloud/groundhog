---
# claude_code — Hardened baseline settings for Claude Code (opt-in).
# Merges OS-level sandboxing, secret-path deny rules, force-push blocks, and
# the ruff PostToolUse formatter into ~/.claude/settings.json without clobbering
# existing user preferences (plugins, theme, model choices).

- name: Ensure Claude Code config directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude"
    state: directory
    mode: "0700"

- name: Render Claude Code baseline fragment to temporary file
  ansible.builtin.template:
    src: baseline-settings.json.j2
    dest: "{{ home_dir }}/.claude/.groundhog-baseline.json"
    mode: "0600"
  changed_when: false

- name: Merge hardened baseline into ~/.claude/settings.json
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_dir }}/groundhog"
      - merge-claude-settings
      - "{{ home_dir }}/.claude/settings.json"
      - "{{ home_dir }}/.claude/.groundhog-baseline.json"
  register: claude_code_merge
  changed_when: "'CHANGED' in claude_code_merge.stdout"

- name: Remove temporary baseline fragment
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude/.groundhog-baseline.json"
    state: absent
  changed_when: false

- name: Ensure Claude Code skills directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude/skills"
    state: directory
    mode: "0755"

- name: Link Groundhog agent skill into Claude Code
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/skills/groundhog"
    dest: "{{ home_dir }}/.claude/skills/groundhog"
    state: link
    force: true

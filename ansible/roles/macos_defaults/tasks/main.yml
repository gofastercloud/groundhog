---
# macos_defaults — Orchestrates macOS preference, privacy, and desktop app tasks.
# Most defaults require a logout/reboot to take full effect.

- name: Configure animations, Siri/Spotlight hotkeys, menu bar, and UI sounds
  ansible.builtin.include_tasks: animations.yml

- name: Configure Desktop, Dock preferences, WindowManager, and Spaces
  ansible.builtin.include_tasks: dock_prefs.yml

- name: Configure performance, Handoff, and dialog panel defaults
  ansible.builtin.include_tasks: performance.yml

- name: Configure Finder defaults
  ansible.builtin.include_tasks: finder.yml

- name: Configure keyboard, trackpad, screenshots, and notifications
  ansible.builtin.include_tasks: keyboard.yml

- name: Configure privacy, telemetry, Application Firewall, and Spotlight exclusions
  ansible.builtin.include_tasks: privacy.yml

- name: Configure remote login and Mosh
  ansible.builtin.include_tasks: remote_login.yml

- name: Configure default file handlers
  ansible.builtin.include_tasks: file_handlers.yml

- name: Configure Shottr preferences
  ansible.builtin.include_tasks: shottr.yml

- name: Configure BetterDisplay preferences
  ansible.builtin.include_tasks: betterdisplay.yml

- name: Configure OrbStack defaults
  ansible.builtin.include_tasks: orbstack.yml

- name: Configure power management
  ansible.builtin.include_tasks: power.yml

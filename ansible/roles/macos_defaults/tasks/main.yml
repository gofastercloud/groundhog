---
# macos_defaults — Nuke the cruft.
# Most of these require a logout/reboot to take effect.

# ============================================================
# Kill animations
# ============================================================
- name: Disable window animations
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticWindowAnimationsEnabled
    type: bool
    value: false

- name: Disable smooth scrolling
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSScrollAnimationEnabled
    type: bool
    value: false

- name: Speed up Mission Control animation
  community.general.osx_defaults:
    domain: com.apple.dock
    key: expose-animation-duration
    type: float
    value: 0.1
  notify: Restart Dock

- name: Disable Finder animations
  community.general.osx_defaults:
    domain: com.apple.finder
    key: DisableAllAnimations
    type: bool
    value: true
  notify: Restart Finder

# com.apple.universalaccess is the user's own domain, so write it as the user
# (no become). On recent macOS these two writes need the terminal running
# Ansible to hold Full Disk Access (System Settings > Privacy & Security);
# without it the write is dropped or fails.
- name: Reduce transparency
  community.general.osx_defaults:
    domain: com.apple.universalaccess
    key: reduceTransparency
    type: bool
    value: true

- name: Reduce motion
  community.general.osx_defaults:
    domain: com.apple.universalaccess
    key: reduceMotion
    type: bool
    value: true

- name: Disable springboard animations (Launchpad)
  community.general.osx_defaults:
    domain: com.apple.dock
    key: springboard-show-duration
    type: float
    value: 0
  notify: Restart Dock

- name: Disable springboard hide animation
  community.general.osx_defaults:
    domain: com.apple.dock
    key: springboard-hide-duration
    type: float
    value: 0
  notify: Restart Dock

# ============================================================
# Kill Siri & Spotlight
# ============================================================
- name: Disable Siri
  community.general.osx_defaults:
    domain: com.apple.assistant.support
    key: "Assistant Enabled"
    type: bool
    value: false

- name: Remove Siri from menu bar
  community.general.osx_defaults:
    domain: com.apple.Siri
    key: StatusMenuVisible
    type: bool
    value: false

# Symbolic hotkeys are nested dicts that osx_defaults cannot edit, so read the
# current state first and only write (and refresh the settings daemon) when a
# shortcut is not already disabled.
#   64  = Spotlight (Cmd+Space; Raycast replaces it)
#   28/29/30/31/184 = macOS screenshot shortcuts (Shottr replaces them; it
#   configures its own hotkeys)
- name: Read symbolic hotkey state
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      # PlistBuddy can't read /dev/stdin reliably; plutil accepts "-" for stdin.
      defaults export com.apple.symbolichotkeys - \
        | plutil -extract "AppleSymbolicHotKeys.{{ item }}.enabled" raw -o - - 2>/dev/null \
        || echo missing
    executable: /bin/bash
  loop: ["64", "28", "29", "30", "31", "184"]
  register: macos_defaults_hotkeys
  changed_when: false
  check_mode: false

- name: Disable Spotlight and screenshot keyboard shortcuts
  ansible.builtin.command:
    cmd: >-
      defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys
      -dict-add "{{ item.item }}" '<dict><key>enabled</key><false/></dict>'
  loop: "{{ macos_defaults_hotkeys.results }}"
  loop_control:
    label: "hotkey {{ item.item }}"
  when: item.stdout | trim != 'false'
  changed_when: true
  notify: Apply symbolic hotkeys

- name: Hide Spotlight icon from menu bar
  community.general.osx_defaults:
    domain: com.apple.Spotlight
    host: currentHost
    key: MenuItemHidden
    type: bool
    value: true
  notify: Restart SystemUIServer

# ============================================================
# Menu bar
# ============================================================
- name: Always show volume control in menu bar
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    key: Sound
    type: int
    value: 18
  notify: Restart SystemUIServer

- name: Show date in menu bar clock
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: ShowDate
    type: int
    value: 1
  notify: Restart SystemUIServer

- name: Show seconds in menu bar clock
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: ShowSeconds
    type: bool
    value: true
  notify: Restart SystemUIServer

# ============================================================
# Disable interface sounds
# ============================================================
- name: Disable UI sound effects
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.sound.uiaudio.enabled
    type: int
    value: 0

- name: Disable system alert sound
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.sound.beep.volume
    type: float
    value: 0

- name: Disable startup sound
  ansible.builtin.command:
    cmd: nvram StartupMute=%01
  become: true
  changed_when: false

# ============================================================
# Kill telemetry & analytics
# ============================================================
- name: Disable Apple analytics sharing
  community.general.osx_defaults:
    domain: "/Library/Application Support/CrashReporter/DiagnosticMessagesHistory"
    key: AutoSubmit
    type: bool
    value: false
  become: true

- name: Disable personalized ads
  community.general.osx_defaults:
    domain: com.apple.AdLib
    key: allowApplePersonalizedAdvertising
    type: bool
    value: false

- name: Disable Siri analytics
  community.general.osx_defaults:
    domain: com.apple.assistant.support
    key: "Siri Data Sharing Opt-In Status"
    type: int
    value: 2

# ============================================================
# Desktop — nothing on it
# ============================================================
- name: Hide desktop icons
  community.general.osx_defaults:
    domain: com.apple.finder
    key: CreateDesktop
    type: bool
    value: false
  notify: Restart Finder

- name: Don't show recent apps in Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: Restart Dock

- name: Autohide Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  notify: Restart Dock

- name: Remove Dock autohide delay
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide-delay
    type: float
    value: 0
  notify: Restart Dock

- name: Speed up Dock reveal
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide-time-modifier
    type: float
    value: 0.15
  notify: Restart Dock

- name: Shrink Dock icon size
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: 36
  notify: Restart Dock

- name: Disable Dock magnification
  community.general.osx_defaults:
    domain: com.apple.dock
    key: magnification
    type: bool
    value: false
  notify: Restart Dock

- name: Minimize windows into app icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: true
  notify: Restart Dock

- name: Minimize with scale effect (fastest)
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: scale
  notify: Restart Dock

- name: Disable app launch bounce animation
  community.general.osx_defaults:
    domain: com.apple.dock
    key: launchanim
    type: bool
    value: false
  notify: Restart Dock

- name: Show configured and running applications in Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: static-only
    type: bool
    value: false
  notify: Restart Dock

# ============================================================
# Disable native window tiling (Raycast handles this)
# ============================================================
- name: Disable window tiling by edge drag
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: EnableTilingByEdgeDrag
    type: bool
    value: false

- name: Disable window tiling by top edge drag
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: EnableTopTilingByEdgeDrag
    type: bool
    value: false

- name: Disable window tiling option-key accelerator
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: EnableTilingOptionAccelerator
    type: bool
    value: false

- name: Disable tiled window margins
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: EnableTiledWindowMargins
    type: bool
    value: false

# ============================================================
# Kill desktop widgets & click-to-show-desktop
# ============================================================
- name: Disable click-to-show-desktop
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: EnableStandardClickToShowDesktop
    type: bool
    value: false

- name: Disable widgets on desktop
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: StandardHideDesktopIcons
    type: bool
    value: true

- name: Disable Stage Manager widget strip
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: StandardHideWidgets
    type: bool
    value: true

- name: Disable widgets in Notification Center
  community.general.osx_defaults:
    domain: com.apple.notificationcenterui
    key: widgetHouse-enabled
    type: bool
    value: false

# ============================================================
# Performance tuning
# ============================================================
- name: Disable window resume (reopen windows on login)
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSQuitAlwaysKeepsWindows
    type: bool
    value: false

- name: Allow App Nap
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAppSleepDisabled
    type: bool
    value: false

- name: Allow automatic termination of inactive apps
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSDisableAutomaticTermination
    type: bool
    value: false

- name: Enable Handoff (shared clipboard, continuity)
  community.general.osx_defaults:
    domain: com.apple.coreservices.useractivityd
    key: ActivityAdvertisingAllowed
    type: bool
    value: true

- name: Enable Handoff receive
  community.general.osx_defaults:
    domain: com.apple.coreservices.useractivityd
    key: ActivityReceivingAllowed
    type: bool
    value: true

- name: Expand save panel by default
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSNavPanelExpandedStateForSaveMode
    type: bool
    value: true

- name: Expand save panel by default (2)
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSNavPanelExpandedStateForSaveMode2
    type: bool
    value: true

- name: Expand print panel by default
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: PMPrintingExpandedStateForPrint
    type: bool
    value: true

- name: Save to disk (not iCloud) by default
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSDocumentSaveNewDocumentsToCloud
    type: bool
    value: false

- name: Disable automatic rearranging of Spaces based on use
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false
  notify: Restart Dock

- name: Disable hot corners
  community.general.osx_defaults:
    domain: com.apple.dock
    key: "{{ item }}"
    type: int
    value: 0
  loop:
    - wvous-tl-corner
    - wvous-tr-corner
    - wvous-bl-corner
    - wvous-br-corner
  notify: Restart Dock

# ============================================================
# Focus & Do Not Disturb
# ============================================================
- name: Note about Focus modes
  ansible.builtin.debug:
    msg: >
      Configure Focus modes manually in System Settings > Focus.
      Recommended: Create a 'Work' focus that silences all except
      Slack, Teams, and calendar alerts. Schedule 9-5 weekdays.

# ============================================================
# Finder tweaks
# ============================================================
- name: Configure Finder defaults
  ansible.builtin.include_tasks: finder.yml

# ============================================================
# Keyboard & Input
# ============================================================
- name: Blazing key repeat rate
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2

- name: Short delay until key repeat
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15

- name: Disable press-and-hold for accents (enable key repeat everywhere)
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false

- name: Disable auto-correct
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false

- name: Disable auto-capitalize
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false

- name: Disable smart dashes
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticDashSubstitutionEnabled
    type: bool
    value: false

- name: Disable smart quotes
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticQuoteSubstitutionEnabled
    type: bool
    value: false

- name: Disable auto period substitution
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false

- name: Enable Full Keyboard Access for all controls in dialogs
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleKeyboardUIMode
    type: int
    value: 3

- name: Allow dragging windows from anywhere with Ctrl+Cmd+Drag
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSWindowShouldDragOnGesture
    type: bool
    value: true

- name: Stop Time Machine prompting to use new disks for backup
  community.general.osx_defaults:
    domain: com.apple.TimeMachine
    key: DoNotOfferNewDisksForBackup
    type: bool
    value: true

- name: Suppress crash reporter modal dialogs (still logs crashes)
  community.general.osx_defaults:
    domain: com.apple.CrashReporter
    key: DialogType
    type: string
    value: none

# ============================================================
# Trackpad / Mouse
# ============================================================
- name: Enable tap to click
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: int
    value: 1

- name: Set tracking speed
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.trackpad.scaling
    type: float
    value: 2.5

# ============================================================
# Screenshots
# ============================================================
- name: Create screenshots directory
  ansible.builtin.file:
    path: "{{ home_dir }}/Screenshots"
    state: directory
    mode: "0755"

- name: Save screenshots to ~/Screenshots
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: location
    type: string
    value: "{{ home_dir }}/Screenshots"
  notify: Restart SystemUIServer

- name: Screenshots as PNG
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: type
    type: string
    value: png
  notify: Restart SystemUIServer

- name: Disable screenshot shadow
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: true
  notify: Restart SystemUIServer

# ============================================================
# Notifications — quiet them down
# ============================================================
- name: Disable notification center on lock screen
  community.general.osx_defaults:
    domain: com.apple.ncprefs
    key: content_visibility
    type: int
    value: 0

- name: Set notification banner display time to 3s
  community.general.osx_defaults:
    domain: com.apple.notificationcenterui
    key: bannerTime
    type: int
    value: 3

# ============================================================
# Launch Services and Spotlight privacy
# ============================================================
# Keep Gatekeeper quarantine provenance checks enabled: LSQuarantine already
# defaults to true, so it is deliberately not set here.

- name: Disable Spotlight suggestions (web results)
  community.general.osx_defaults:
    domain: com.apple.lookup.shared
    key: LookupSuggestionsDisabled
    type: bool
    value: true

- name: Disable Game Center
  community.general.osx_defaults:
    domain: com.apple.gamed
    key: Disabled
    type: bool
    value: true

# com.apple.NetworkBrowser DisableAirDrop and the user-domain
# com.apple.Bluetooth PrefKeyServicesEnabled are obsolete and have no effect on
# current macOS. AirDrop visibility is controlled by sharingd.
- name: Disable AirDrop discoverability
  community.general.osx_defaults:
    domain: com.apple.sharingd
    key: DiscoverableMode
    type: string
    value: "Off"

# Apple spells the key "Reciever" (sic) in Control Center's ByHost plist.
# Frees ports 5000 and 7000 and closes inbound AirPlay listeners.
- name: Disable AirPlay Receiver
  community.general.osx_defaults:
    domain: com.apple.controlcenter
    host: currentHost
    key: AirplayRecieverEnabled
    type: bool
    value: false
  notify: Restart ControlCenter

# NOTE: "Disable remote Apple events" removed — requires Full Disk Access
# which Ansible won't have. Remote Apple Events is off by default on macOS.

# ============================================================
# Security & Privacy
# ============================================================
# Read the current firewall state first (no privileges needed) and only change
# it when it differs, so re-runs report no change.
- name: Read application firewall state
  ansible.builtin.command:
    cmd: "/usr/libexec/ApplicationFirewall/socketfilterfw {{ item }}"
  loop: ["--getglobalstate", "--getstealthmode"]
  register: macos_defaults_firewall
  changed_when: false
  check_mode: false

- name: Enable firewall
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  become: true
  when: "'enabled' not in macos_defaults_firewall.results[0].stdout"
  changed_when: true

- name: Enable stealth mode
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  become: true
  when: "'is on' not in macos_defaults_firewall.results[1].stdout"
  changed_when: true

# NOTE: askForPassword / askForPasswordDelay removed — no longer honored
# on Sequoia. Lock screen timing is controlled via System Settings > Lock Screen.

# ============================================================
# Remove Apple cruft apps (SIP-safe method)
# Some apps can't be removed without disabling SIP.
# We hide what we can and remove what we can.
# ============================================================
- name: Remove Apple apps that are safe to delete
  ansible.builtin.file:
    path: "/Applications/{{ item }}"
    state: absent
  loop: "{{ apple_apps_to_remove }}"
  become: true

# NOTE: "Hide non-removable Apple cruft from Launchpad" removed — the sqlite3
# approach to the Launchpad database is fragile and breaks across macOS versions.
# These apps are harmless; just don't add them to the Dock.

# ============================================================
# Spotlight — exclude dev directories for performance
# ============================================================
- name: Ensure Spotlight exclusion directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ spotlight_exclusions }}"

# Best effort: modern Spotlight (mds) does not reliably honour
# .metadata_never_index on every volume or directory. For a guaranteed
# exclusion add the paths under System Settings > Spotlight > Search Privacy.
- name: Exclude directories from Spotlight indexing
  ansible.builtin.file:
    path: "{{ item }}/.metadata_never_index"
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"
  loop: "{{ spotlight_exclusions }}"

- name: Configure remote login and Mosh
  ansible.builtin.include_tasks: remote_login.yml

# ============================================================
# Default file handlers (duti)
# ============================================================
- name: Configure default file handlers
  ansible.builtin.include_tasks: file_handlers.yml

# ============================================================
# Shottr screenshot shortcuts & preferences
# ============================================================
- name: Configure Shottr preferences
  ansible.builtin.include_tasks: shottr.yml

# ============================================================
# BetterDisplay portable shortcuts & privacy preferences
# ============================================================
- name: Configure BetterDisplay preferences
  ansible.builtin.include_tasks: betterdisplay.yml

# ============================================================
# OrbStack hardened container/VM defaults
# ============================================================
- name: Configure OrbStack defaults
  ansible.builtin.include_tasks: orbstack.yml

# ============================================================
# Power Management
# ============================================================
- name: Configure power management
  ansible.builtin.include_tasks: power.yml

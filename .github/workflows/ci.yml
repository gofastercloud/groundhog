name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh
          python3 -m pip install --quiet ansible-core ansible-lint yamllint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Shell syntax & ShellCheck
        run: |
          bash -n dotfiles.sh
          bash -n ansible/bootstrap.sh
          bash -n tests/test_setup.sh
          bash -n tests/nu_startup_check.sh
          zsh -n zsh/.zshrc
          zsh -n zsh/.zprofile
          shellcheck --severity=warning dotfiles.sh ansible/bootstrap.sh tests/test_setup.sh tests/nu_startup_check.sh

      - name: YAML lint
        run: yamllint .pre-commit-config.yaml ansible/ gh/ lazygit/

      - name: Ansible syntax & lint
        run: |
          cd ansible && ansible-playbook -i localhost, setup.yml --syntax-check
          cd .. && ANSIBLE_DEPRECATION_WARNINGS=0 ansible-lint --offline ansible

      - name: Check for hardcoded user paths
        run: |
          ! grep -rnE '/Users/[A-Za-z0-9._-]+' \
            --exclude-dir=.git --exclude-dir=docs --exclude='test_setup.sh' --exclude='lazy-lock.json' .
